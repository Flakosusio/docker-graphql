name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker login
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "iniciando login"
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin
          echo "finalizando login"

      - name: Build docker image
        run: |
          docker build -t flutox/docker-graphql:0.0.2 .
          docker build -t flutox/docker-graphql:latest .

      - name: Push docker image
        run: |
          docker push flutox/docker-graphql:0.0.2
          docker push flutox/docker-graphql:latest
